; Xdebug is compiled into the `dev` image but disabled by default, so there is no request overhead.
; To enable it:
;
;   XDEBUG_MODE=debug docker compose up api

xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
