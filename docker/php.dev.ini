; Development counterpart to docker/php.ini, loaded only by the `dev` stage.

; Memory & execution — no time limit so Xdebug stepping doesn't get killed.
memory_limit = 512M
max_execution_time = 0
max_input_time = 60

; Uploads
post_max_size = 20M
upload_max_filesize = 20M

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Error display
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr

; Timezone
date.timezone = UTC
